<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;color:var(--foreground,#172330);font:16px/1.5 system-ui}section{padding:18px;background:var(--card,#f5f7fa);border:1px solid var(--border,#d8dce1);border-radius:var(--radius,12px)}h2{font-size:19px;margin:10px 0}img{display:block;width:100%;height:290px;object-fit:contain;background:white;border-radius:8px}button,select{font:inherit;padding:8px;border:1px solid var(--border,#ccd2da);border-radius:6px;cursor:pointer;background:var(--secondary,#edf1f5);color:inherit}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}small{color:var(--muted-foreground,#526275)}#answer{padding:14px 0}select{max-width:100%;width:100%}</style><section><small>Exercícios com figuras geradas</small><select id="select" aria-label="Escolher exercício"></select><h2 id="question"></h2><img id="figure" alt="Figura do exercício"><nav><button id="show">Mostrar resposta</button><button id="next">Próximo exercício</button></nav><div id="answer" hidden></div></section><script>const cards=[{"frente":"Na figura de k-NN, qual classe o novo ponto recebe com voto uniforme?","verso":"Classe A. Entre os três vizinhos dentro do círculo, dois pertencem a A e um a B.","tipo":"exercicio","imagem":"ml_knn.png","tema":"Vizinhos SVM e Naive Bayes"},{"frente":"Na árvore ilustrada, com previsão de chuva de 8 mm, qual folha é alcançada?","verso":"Não irrigar, pois 8 > 5. A figura representa uma regra fictícia para estudar árvores, não uma recomendação agronômica.","tipo":"exercicio","imagem":"ml_arvore.png","fonte":"https://scikit-learn.org/stable/modules/tree.html","tema":"Árvores florestas e boosting"},{"frente":"Na figura dos clientes, que perfil tem o grupo roxo?","verso":"Gasto mensal alto e frequência de compras intermediária. Esse agrupamento ilustrativo não prova preferência, renda ou motivo de compra.","tipo":"exercicio","imagem":"ml_clusters.png","tema":"Agrupamento redução e anomalias"},{"frente":"Na figura de reforço, o que o agente envia e o que recebe?","verso":"Envia uma ação ao ambiente. Recebe informação do novo estado e a recompensa.","tipo":"exercicio","imagem":"ml_reforco.png","tema":"Aprendizado por reforço"}];let n=0;const select=document.getElementById('select');cards.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.tema;select.appendChild(o)});function display(){const c=cards[n];document.getElementById('question').textContent=c.frente;document.getElementById('figure').src='../media/'+c.imagem;document.getElementById('answer').textContent=c.verso;document.getElementById('answer').hidden=true;document.getElementById('show').textContent='Mostrar resposta';select.value=n}select.onchange=()=>{n=Number(select.value);display()};document.getElementById('show').onclick=()=>{const a=document.getElementById('answer');a.hidden=!a.hidden;document.getElementById('show').textContent=a.hidden?'Mostrar resposta':'Ocultar resposta'};document.getElementById('next').onclick=()=>{n=(n+1)%cards.length;display()};display();console.log('Exercícios visuais:',cards.length);</script></html>
